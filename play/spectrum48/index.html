<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>devela · ZX Spectrum 48K</title>
  <script src="./jsspeccy/jsspeccy.js"></script>
</head>
<body>
  <div id="jsspeccy"></div>

  <script>
    const demo = new URLSearchParams(location.search)
      .get("demo") || "screen.tap";

    if (!/^[a-zA-Z0-9][a-zA-Z0-9_-]*\.tap$/.test(demo)) {
      document.body.textContent = "Invalid demo filename.";
    } else {
      const binaries =
        "https://raw.githubusercontent.com/andamira/devela/main/" +
        "crates/micros/examples/computer/zx/spectrum48/demo/";

      JSSpeccy(document.getElementById("jsspeccy"), {
        machine: 48,
        zoom: 2,
        autoStart: true,
        autoLoadTapes: true,
        openUrl: binaries + demo
      });
    }
  </script>
</body>
</html>

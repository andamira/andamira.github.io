<!doctype html>
<meta charset="utf-8">
<title>devela · Atari 800XL</title>
<script>
const demo = new URLSearchParams(location.search).get("demo") || "atari800xl.xex";

if (!/^[a-zA-Z0-9][a-zA-Z0-9_-]*\.xex$/.test(demo)) {
  document.body.textContent = "Invalid demo filename.";
} else {
  const binaries = "https://raw.githubusercontent.com/andamira/devela/main/crates/micros/examples/computer/atari/atari800xl/demo/";
  const firmware = new URL("./", location.href).href;

  location.replace("https://mrk.sed.pl/bevy-atari/#" + [
    `xex=${binaries}${demo}`,
    `osrom=${firmware}atari800-altirraos_xl.rom`,
    `basic=${firmware}atari800-altirra_basic.rom`,
    "no-cache"
  ].join("||"));
}
</script>

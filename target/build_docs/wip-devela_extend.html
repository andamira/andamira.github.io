<style>
.devela-wip-banner {
    box-sizing: border-box;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: baseline;
    gap: .2rem .55rem;

    width: 100%;
    margin: 0 0 1rem;
    padding: .3rem .65rem;

    border: 1px solid var(--border-color);
    border-radius: 4px;

    background: var(--main-background-color);
    color: var(--main-color);

    font-size: .75rem;
    line-height: 1.4;
}

.devela-wip-banner > * {
    white-space: nowrap;
}

.devela-wip-banner > * + *::before {
    content: "·";
    margin-right: .55rem;
    opacity: .45;
}

.devela-wip-banner a {
    color: inherit;
    text-decoration: none;
}

.devela-wip-banner a:hover {
    text-decoration: underline;
}

.devela-wip-banner .wip {
    font-weight: 700;
    letter-spacing: .08em;
}

.devela-wip-banner code {
    font-size: inherit;
}

@media (max-width: 700px) {
    .devela-wip-banner {
        justify-content: flex-start;
        font-size: .72rem;
    }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const main = document.querySelector("main");
    if (!main || main.querySelector(".devela-wip-banner")) return;

    const banner = document.createElement("aside");
    banner.className = "devela-wip-banner";
    banner.setAttribute("aria-label", "WIP documentation build");

    banner.innerHTML =
        '<a class="wip" href="https://andamira.github.io/devela_extend/wip/devela_extend/">WIP</a>' +
        '<span>devela_extend 0.31.0-wip</span>' +
        '<span>MSRV 1.99.0</span>' +
        '<span>built 2026-10-19</span>' +
        '<span>source <a href="https://github.com/andamira/devela/commit/ff81cb0907a5fe3abf57fa990eeed9c271563fc0">' +
        '<code>ff81cb09+dirty</code></a></span>';

    main.prepend(banner);
});
</script>
